<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>正气打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="正气打卡">
<meta name="theme-color" content="#5BA89C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 首页 -->
<section class="page active" id="page-home">
  <header class="hero">
    <div class="hero-inner">
      <div class="tree-wrap" id="tree-wrap"></div>
      <div class="hero-info">
        <div class="day-badge">戒第 <b id="streak-days">0</b> 天</div>
        <div class="zq-value">正气值 <b id="zq-score">0</b></div>
      </div>
      <p class="hero-slogan">请保持身心清净，增长正气</p>
    </div>
  </header>

  <div class="quote-card">
    <div class="quote-tag">良言</div>
    <p class="quote-text" id="quote-text"></p>
    <p class="quote-from" id="quote-from"></p>
  </div>

  <div class="checkin-area">
    <button class="btn-checkin" id="btn-checkin">
      <span class="btn-checkin-main" id="btn-checkin-text">今日打卡</span>
      <span class="btn-checkin-sub" id="btn-checkin-sub">守住一天，便是一天的胜利</span>
    </button>
  </div>

  <div class="mini-stats">
    <div class="mini-stat"><b id="ms-streak">0</b><span>当前连续</span></div>
    <div class="mini-stat"><b id="ms-best">0</b><span>历史最长</span></div>
    <div class="mini-stat"><b id="ms-total">0</b><span>累计成功</span></div>
  </div>
</section>

<!-- 记录（月历） -->
<section class="page" id="page-calendar">
  <div class="cal-header">
    <button class="cal-nav" id="cal-prev" aria-label="上月">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-nav" id="cal-next" aria-label="下月">›</button>
  </div>
  <div class="cal-weekdays">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-legend">
    <span class="legend-item"><i class="legend-dot ok">✓</i> 守住</span>
    <span class="legend-item"><i class="legend-dot bad">!</i> 破戒</span>
    <span class="legend-item"><i class="legend-ring"></i> 今天</span>
  </div>
</section>

<!-- 我的 -->
<section class="page" id="page-me">
  <div class="me-title">统计</div>
  <div class="stat-cards">
    <div class="stat-card"><b id="st-streak">0</b><span>当前连续（天）</span></div>
    <div class="stat-card"><b id="st-best">0</b><span>历史最长（天）</span></div>
    <div class="stat-card"><b id="st-total">0</b><span>累计成功（次）</span></div>
    <div class="stat-card"><b id="st-relapse">0</b><span>破戒次数</span></div>
  </div>

  <div class="me-title">破戒教训墙</div>
  <div class="lesson-list" id="lesson-list"></div>

  <div class="me-title">数据</div>
  <div class="me-actions">
    <button class="btn-round" id="btn-export">导出数据（JSON）</button>
    <button class="btn-round" id="btn-import">导入数据</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <button class="btn-round danger" id="btn-clear">清空全部数据</button>
  </div>
  <p class="me-note">数据仅保存在本机浏览器，不会上传。清除浏览器数据前请先导出备份。</p>
</section>

<!-- 底部导航 -->
<nav id="tabbar">
  <button class="tab active" data-page="page-home">
    <svg viewBox="0 0 24 24"><path d="M12 2C12 2 5 8 5 14a7 7 0 0 0 14 0C19 8 12 2 12 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 21v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>正气</span>
  </button>
  <button class="tab" data-page="page-calendar">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>记录</span>
  </button>
  <button class="tab" data-page="page-me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>我</span>
  </button>
</nav>

<!-- 打卡弹窗 -->
<div class="modal-mask" id="modal-checkin" hidden>
  <div class="modal-sheet">
    <div class="sheet-grabber"></div>

    <div class="sheet-step" id="step-choose">
      <h3 id="checkin-title">今天过得怎么样？</h3>
      <button class="choice ok" id="choice-success">
        <span class="choice-emoji">✓</span>
        <span class="choice-text"><b>今日守住了</b><small>继续保持，积累正气</small></span>
      </button>
      <button class="choice bad" id="choice-relapse">
        <span class="choice-emoji">✗</span>
        <span class="choice-text"><b>我破戒了</b><small>直面它，写下教训重新出发</small></span>
      </button>
      <button class="btn-text" id="checkin-cancel">取消</button>
    </div>

    <div class="sheet-step" id="step-note" hidden>
      <h3 id="note-title">心得体会</h3>
      <p class="note-hint" id="note-hint"></p>
      <textarea id="note-input" rows="5" maxlength="500" placeholder=""></textarea>
      <div class="note-count"><span id="note-count">0</span>/500</div>
      <button class="btn-submit" id="note-submit">完成</button>
      <button class="btn-text" id="note-back">返回</button>
    </div>
  </div>
</div>

<!-- 某日详情弹窗 -->
<div class="modal-mask" id="modal-day" hidden>
  <div class="modal-sheet">
    <div class="sheet-grabber"></div>
    <h3 id="day-title"></h3>
    <div id="day-body"></div>
    <div class="day-actions">
      <button class="btn-round small" id="day-edit">记录 / 修改</button>
      <button class="btn-round small danger" id="day-delete" hidden>删除记录</button>
    </div>
    <button class="btn-text" id="day-close">关闭</button>
  </div>
</div>

<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
